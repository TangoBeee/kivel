name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Skipping the man-db index rebuild turns a 20+ minute install into well under a minute.
      - run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Require changesets for published client changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-client-changesets.mjs "$BASE_SHA"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:packages
      - run: pnpm test:releases
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
      - run: docker build --tag socket-help:local .
      - run: node scripts/setup-env.mjs
      - run: docker compose -f compose.yaml -f compose.production.yaml build database proxy
      - run: docker compose up -d --wait --wait-timeout 90
      - run: pnpm test:smoke
      - run: pnpm test:backup
      - run: pnpm test:https
      - run: pnpm scan:images
      - if: failure() && hashFiles('.env') != ''
        run: docker compose logs --tail=50 app
      - if: always() && hashFiles('.env') != ''
        run: docker compose down --volumes
