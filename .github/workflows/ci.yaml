name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Skipping the man-db index rebuild turns a 20+ minute install into well under a minute.
      - run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Require changesets for published client changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-client-changesets.mjs "$BASE_SHA"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:packages
      - run: pnpm test:releases
      - run: pnpm test:operations
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
      # Image builds reuse layers from earlier runs; database, proxy and mail share the Deploy caches.
      - uses: docker/setup-buildx-action@v3
      - id: packages
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: socket-help:local
          build-args: PACKAGES_DAY=${{ steps.packages.outputs.day }}
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,mode=max,scope=ci-app
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/postgres.Dockerfile
          load: true
          tags: socket-help-postgres:local
          build-args: PACKAGES_DAY=${{ steps.packages.outputs.day }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caddy.Dockerfile
          load: true
          tags: socket-help-proxy:local
          build-args: PACKAGES_DAY=${{ steps.packages.outputs.day }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/mail.Dockerfile
          load: true
          tags: socket-help-mail:local
          build-args: PACKAGES_DAY=${{ steps.packages.outputs.day }}
          cache-from: type=gha,scope=mail
          cache-to: type=gha,mode=max,scope=mail
      - run: node scripts/setup-env.mjs
      - run: docker compose up -d --wait --wait-timeout 90
      - run: pnpm test:agent-mail
      - run: pnpm test:smoke
      - run: pnpm test:backup
      - run: pnpm test:https
      - run: pnpm scan:images
      - if: failure() && hashFiles('.env') != ''
        run: docker compose logs --tail=50 app
      - if: always() && hashFiles('.env') != ''
        run: docker compose down --volumes
