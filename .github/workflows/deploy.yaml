name: Deploy
# Every push to main that passes CI is built into images, pushed to Docker Hub and rolled out to
# the production server. Run it by hand to redeploy main or any earlier commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy (defaults to main)
        required: false
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  REPOSITORY: tangobee/socket
  DOMAIN: kivel.io
jobs:
  deploy:
    # Nothing runs until the DEPLOY_HOST variable names the server.
    if: >-
      vars.DEPLOY_HOST != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
      - name: Check app DNS before deploy
        run: |
          if [ -d dashboard ] && ! getent ahosts "app.$DOMAIN" >/dev/null; then
            echo "::error::Point app.$DOMAIN at the production proxy before deploying."
            exit 1
          fi
      - id: release
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - id: packages
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: tangobee
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Production runs with paid plans on; the frontend is built with that baked in.
          build-args: |
            PACKAGES_DAY=${{ steps.packages.outputs.day }}
            BILLING_ENABLED=true
            SITE_URL=https://${{ env.DOMAIN }}
            APP_URL=https://app.${{ env.DOMAIN }}
          tags: ${{ env.REPOSITORY }}:app-${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build and push the database
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/postgres.Dockerfile
          push: true
          tags: ${{ env.REPOSITORY }}:postgres-${{ steps.release.outputs.tag }}
          build-args: PACKAGES_DAY=${{ steps.packages.outputs.day }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Build and push the proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caddy.Dockerfile
          push: true
          tags: ${{ env.REPOSITORY }}:proxy-${{ steps.release.outputs.tag }}
          build-args: PACKAGES_DAY=${{ steps.packages.outputs.day }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
      - name: Build and push the agent mail relay
        if: hashFiles('deploy/mail.Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/mail.Dockerfile
          push: true
          tags: ${{ env.REPOSITORY }}:mail-${{ steps.release.outputs.tag }}
          build-args: PACKAGES_DAY=${{ steps.packages.outputs.day }}
          cache-from: type=gha,scope=mail
          cache-to: type=gha,mode=max,scope=mail
      - name: Roll out to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy
          remote() { ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@$HOST" "$@"; }
          files=()
          for path in compose.yaml compose.production.yaml compose.smtp.yaml deploy/Caddyfile deploy/init-app.sql deploy/server-deploy.sh deploy/cloudflare-firewall.sh deploy/systemd scripts/backup.mjs scripts/verify-backup.mjs scripts/restore-offsite.mjs scripts/disk-alert.mjs; do
            if [ -e "$path" ]; then files+=("$path"); fi
          done
          tar -czf - "${files[@]}" \
            | remote 'tar -xzf - -C /opt/socket-help'
          remote "bash /opt/socket-help/deploy/server-deploy.sh $TAG"
      - name: Check the live site
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null "https://$DOMAIN/ready"
          node scripts/production-check.mjs "https://$DOMAIN"
      # Tell Bing (and engines that share IndexNow) about every page, so new pages get crawled quickly.
      - name: Notify search engines
        continue-on-error: true
        run: |
          urls=$(curl -fsS "https://$DOMAIN/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | head -9000 | jq -R . | jq -s -c .)
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'content-type: application/json; charset=utf-8' \
            -d "{\"host\":\"$DOMAIN\",\"key\":\"b955618984d915d5a6e26746a914318c\",\"keyLocation\":\"https://$DOMAIN/b955618984d915d5a6e26746a914318c.txt\",\"urlList\":$urls}" -o /dev/null -w 'IndexNow: %{http_code}\n'
      - name: Retain the newest ten complete image releases
        if: vars.DOCKERHUB_RETENTION_ENABLED == 'true' && vars.DOCKERHUB_RETENTION_DRY_RUN_CONFIRMED == 'true' && hashFiles('scripts/dockerhub-retention.mjs') != ''
        env:
          DOCKERHUB_USERNAME: tangobee
          DOCKERHUB_RETENTION_TOKEN: ${{ secrets.DOCKERHUB_RETENTION_TOKEN }}
          DOCKERHUB_RETENTION_DRY_RUN_CONFIRMED: ${{ vars.DOCKERHUB_RETENTION_DRY_RUN_CONFIRMED }}
          CURRENT_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/dockerhub-retention.mjs --apply
