name: Client releases
on:
  push:
    branches: [main]
    paths:
      - 'packages/sdk/**'
      - 'packages/cli/**'
      - '.changeset/**'
      - 'scripts/*client*'
      - 'scripts/test-packages.mjs'
      - '.github/workflows/publish-clients.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-releases
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish_plan_id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Require release notes on direct main pushes too
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-client-changesets.mjs "$BASE_SHA"
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: mode
  version:
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm release:version
          commit-message: 'chore: version client packages'
          pr-title: 'Release SDK and CLI packages'
  verify:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kivel/sdk build
      - run: pnpm --filter @kivel/sdk typecheck
      - run: pnpm --filter @kivel/cli typecheck
      - run: pnpm --filter @kivel/cli test
      - run: pnpm test:releases
      - run: pnpm test:packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.publish_plan_id }}
          path: release/
          merge-multiple: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-clients
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-clients
          path: release/
      - name: Publish verified SDK then CLI with npm OIDC
        run: node scripts/publish-clients.mjs --publish beta
  tag:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-clients
          path: release/
      - name: Record package tags and beta release notes
        run: node scripts/tag-client-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
