name: socket-help

services:
  app:
    build:
      context: .
      args:
        BILLING_ENABLED: ${BILLING_ENABLED:-false}
        BILLING_PRICE_SCHEDULE: ${BILLING_PRICE_SCHEDULE:-}
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        APP_URL: ${APP_URL:-http://127.0.0.1:8080}
    image: ${APP_IMAGE:-kivel:local}
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3000'
      - '${SSH_BIND_ADDRESS:-127.0.0.1}:${SSH_PUBLIC_PORT:-2222}:2222'
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:8080}
      DATABASE_URL: postgres://socket:${APP_DATABASE_PASSWORD:?Run node scripts/setup-env.mjs}@database:5432/socket
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_SECRET: ${AUTH_SECRET:?Run node scripts/setup-env.mjs}
      SSH_PORT: ${SSH_PORT:-2222}
      SSH_HOST_KEY_PATH: /app/state/ssh_host_ed25519
      MAX_RESOURCE_BYTES: ${MAX_RESOURCE_BYTES:-4294967296}
      MAX_RESOURCES: ${MAX_RESOURCES:-10000}
      MAX_TOTAL_INBOX_BYTES: ${MAX_TOTAL_INBOX_BYTES:-1073741824}
      MAX_INBOXES: ${MAX_INBOXES:-10000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      DODO_PAYMENTS_ENVIRONMENT: ${DODO_PAYMENTS_ENVIRONMENT:-test_mode}
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY:-}
      DODO_PAYMENTS_WEBHOOK_KEY: ${DODO_PAYMENTS_WEBHOOK_KEY:-}
      DODO_PRO_PRODUCT_ID: ${DODO_PRO_PRODUCT_ID:-}
      PHONE_ENABLED: ${PHONE_ENABLED:-false}
      PHONE_ADDON_PRICE_CONFIRMED: ${PHONE_ADDON_PRICE_CONFIRMED:-false}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY:-}
      TELNYX_MESSAGING_PROFILE_ID: ${TELNYX_MESSAGING_PROFILE_ID:-}
      DODO_PHONE_ADDON_ID: ${DODO_PHONE_ADDON_ID:-}
      DODO_TEAM_PRODUCT_ID: ${DODO_TEAM_PRODUCT_ID:-}
      DODO_LEGACY_PRODUCT_IDS: ${DODO_LEGACY_PRODUCT_IDS:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      EMAIL_INGEST_SECRET: ${EMAIL_INGEST_SECRET:-}
      EMAIL_SENDING_ENABLED: ${EMAIL_SENDING_ENABLED:-false}
      AGENT_SMTP_HOST: mail
      AGENT_SMTP_PORT: 587
      SMTP_CAPTURE_PORT: ${SMTP_CAPTURE_PORT:-0}
      SMTP_CAPTURE_PUBLIC_HOST: ${SMTP_CAPTURE_PUBLIC_HOST:-}
      SMTP_CAPTURE_PUBLIC_PORT: ${SMTP_CAPTURE_PUBLIC_PORT:-465}
      SMTP_CAPTURE_CERT_PATH: ${SMTP_CAPTURE_CERT_PATH:-}
      SMTP_CAPTURE_KEY_PATH: ${SMTP_CAPTURE_KEY_PATH:-}
    depends_on:
      database:
        condition: service_healthy
    networks:
      default:
      agent_mail:
        ipv4_address: ${MAIL_NETWORK_PREFIX:-10.205.0}.3
    volumes:
      - ssh_host_keys:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  mail:
    build:
      context: .
      dockerfile: deploy/mail.Dockerfile
    image: ${MAIL_IMAGE:-kivel-mail:local}
    restart: unless-stopped
    environment:
      APP_MAIL_ADDRESS: ${MAIL_NETWORK_PREFIX:-10.205.0}.3
    volumes:
      - agent_mail_queue:/var/spool/postfix
      - agent_mail_keys:/etc/opendkim/keys
    networks:
      agent_mail:
        ipv4_address: ${MAIL_NETWORK_PREFIX:-10.205.0}.2
      mail_delivery:
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  database:
    build:
      context: .
      dockerfile: deploy/postgres.Dockerfile
    image: ${DATABASE_IMAGE:-kivel-postgres:local}
    restart: unless-stopped
    environment:
      POSTGRES_DB: socket
      POSTGRES_USER: socket_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.mjs}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run node scripts/setup-env.mjs}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/init-app.sql:/docker-entrypoint-initdb.d/10-app.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U socket_admin -d socket']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  postgres_data:
  ssh_host_keys:
  agent_mail_queue:
  agent_mail_keys:

networks:
  agent_mail:
    internal: true
    ipam:
      config:
        - subnet: ${MAIL_NETWORK_PREFIX:-10.205.0}.0/24
  mail_delivery:
